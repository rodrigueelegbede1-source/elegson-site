            e("div", { className: "flex flex-col gap-3 pt-5 text-[11px] text-ink-soft sm:flex-row sm:items-center sm:justify-between sm:text-xs" },
              e("span", null, "© ", new Date().getFullYear(), " Elegson. Tous droits réservés."),
              e("a", { href: "#accueil", className: "inline-flex w-fit items-center gap-2 font-medium transition hover:text-royal" }, "Retour en haut", e(Icon, { name: "arrow", size: 13, className: "-rotate-90" }))
            )
          )
        );
      }

      function App() {
        const [contactOpen, setContactOpen] = React.useState(false);
        const [requestedService, setRequestedService] = React.useState("");
        const previousFocus = React.useRef(null);
        const openContact = React.useCallback((service = "") => {
          previousFocus.current = document.activeElement;
          setRequestedService({
            "Applications": "Application",
            "Logiciels sur mesure": "Logiciel sur mesure",
          }[service] || service);
          setContactOpen(true);
        }, []);
        const closeContact = React.useCallback(() => {
          setContactOpen(false);
          requestAnimationFrame(() => previousFocus.current?.focus());
        }, []);

        React.useEffect(() => {
          const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const revealItems = document.querySelectorAll("main section > div, main article, footer > div > div");
          revealItems.forEach((item) => item.classList.add("scroll-reveal"));

          if (!("IntersectionObserver" in window) || reduceMotion) {
            revealItems.forEach((item) => item.classList.add("is-visible"));
          } else {
            const observer = new IntersectionObserver((entries, currentObserver) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  currentObserver.unobserve(entry.target);
                }
              });
            }, { threshold: 0.12 });
            revealItems.forEach((item) => observer.observe(item));
            return () => observer.disconnect();
          }
        }, []);

        return e(React.Fragment, null,
          e(Hero, { onContact: openContact }),
          e("main", null, e(Intro), e(DigitalCompany, { onContact: openContact }), e(Method), e(Expertise, { onContact: openContact }), e(Closing, { onContact: openContact })),
          e(Footer),
          contactOpen ? e(ContactDialog, { onClose: closeContact, requestedService }) : null
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(e(App));
    </script>
  </body>
</html>
